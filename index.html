(-50%);color:#b45e24;font-size:22px;font-weight:900}@keyframes tutorial-pulse{0%{filter:brightness(1)}to{filter:brightness(1.12)}}#message{min-height:24px;margin:12px 2px 0;color:#7e7478;font-size:14px}#collection{grid-row:4;display:none;min-width:0;padding:7px 10px 6px;border-top:1px solid rgba(201,162,39,.38);border-radius:16px;background:#fff6e5b8}.collection-heading{display:flex;align-items:baseline;justify-content:center;gap:9px;margin-bottom:4px;color:#4a4a52;font-size:14px;font-weight:700}.collection-heading small{color:#8d8388;font-size:11px;font-weight:500}.collection-slots{display:flex;justify-content:center;gap:8px;width:100%;overflow-x:auto;padding:2px 0 4px;scrollbar-width:thin}.cat-slot{position:relative;flex:0 0 48px;width:48px;height:48px;display:grid;place-items:center;border:1px solid rgba(201,162,39,.42);border-radius:14px;background:#9aa3ad1f;box-shadow:inset 0 1px 2px #4a4a5214;cursor:pointer}.cat-slot .cat-portrait{width:40px;height:40px;display:block}.cat-slot small{position:absolute;right:4px;bottom:3px;color:#7e7478;font-size:10px;font-variant-numeric:tabular-nums}#mobile-cattery-toggle{padding:4px 10px;min-height:44px;box-shadow:none;font-size:12px}@media (max-width: 900px){.shell{border-radius:16px;padding:10px;gap:6px}.topbar{gap:8px}.topbar>div:first-child{flex:1 1 180px}h1{font-size:clamp(19px,5.4vw,28px)}.brand-subtitle{font-size:11px}.subline{gap:6px;font-size:11px}.topbar .controls{gap:6px}.topbar button,.topbar .treats-hud{min-height:44px;padding:7px 10px;font-size:12px}#game-layout{grid-template-columns:minmax(0,1fr);gap:6px}#play-area{gap:4px}#game{border-radius:12px}.play-controls{gap:6px}.play-controls button{flex:1 1 96px;padding:7px 9px;font-size:12px}#message{margin:2px 2px 0;font-size:11px;min-height:18px}#collection{display:block}#cattery{display:none}#cattery-back{display:inline-flex;align-items:center}body[data-view=cattery] #play-area,body[data-view=cattery] #tutorial{display:none}body[data-view=cattery][data-tutorial-st <body>
  <div class="shell">
    <div class="topbar">
      <div>
        <h1 id="game-title">拯救小猫咪 / Kitty Rescue</h1>
        <p class="brand-subtitle">Stack the tiles, free the cats.</p>
        <div class="subline">
          <span id="level-name"></span>
          <span id="stats"></span>
        </div>
      </div>
      <div class="controls">
        <span id="treats-hud" class="treats-hud">🐟 0</span>
        <div id="unlock-widget" class="unlock-widget" aria-label="本关实时猫条进度">
          <svg class="unlock-ring" viewBox="0 0 72 72" aria-hidden="true">
            <circle class="unlock-ring-bg" cx="36" cy="36" r="30"></circle>
            <circle id="unlock-ring-progress" class="unlock-ring-progress" cx="36" cy="36" r="30"></circle>
          </svg>
          <div id="unlock-cage" class="unlock-cage">
            <div id="unlock-cat" class="unlock-cat"></div>
            <span id="unlock-fish" class="unlock-fish" aria-hidden="true">
              <svg viewBox="0 0 28 18">
                <path d="M4 9c5-7 14-7 21 0-7 7-16 7-21 0Z" fill="#78CBEA" stroke="#2F6F8F" stroke-width="1.8"></path>
                <path d="M4 9 0 3v12Z" fill="#78CBEA" stroke="#2F6F8F" stroke-width="1.8" stroke-linejoin="round"></path>
                <circle cx="20" cy="7" r="1.5" fill="#384B57"></circle>
              </svg>
            </span>
          </div>
          <div id="unlock-links" class="unlock-links"></div>
          <span id="unlock-count" class="unlock-count">0/8</span>
        </div>
        <button id="mute" type="button" aria-pressed="false">猫铃：开</button>
        <button id="restart" type="button">重开猫局</button>
        <button id="next" type="button">下一窝猫</button>
      </div>
    </div>
    <div id="tutorial" hidden>
      <span id="tutorial-step">1/7</span>
      <span id="tutorial-text"></span>
      <button id="tutorial-next" type="button" hidden>下一步</button>
      <button id="tutorial-skip" type="button">先跳过猫教程</button>
    </div>
    <main id="game-layout">
      <section id="play-area">
        <div id="canvas-wrap">
          <canvas id="game" width="960" height="540" aria-label="拯救小猫咪叠牌消除游戏"></canvas>
          <div id="tutorial-slot-focus" hidden aria-hidden="true"></div>
        </div>
        <div class="controls play-controls">
          <button id="copy" type="button">猫猫复制（2）</button>
          <button id="color" type="button">猫爪变色（2）</button>
          <button id="bomb" type="button">毛球炸弹（2）</button>
          <button id="shuffle" type="button">抖一抖（3）</button>
          <button id="undo" type="button">退一步（1）</button>
          <button id="move-out" type="button">放进猫窝（2）</button>
        </div>
        <div id="message" role="status" aria-live="polite"></div>
      </section>
      <aside id="cattery" aria-label="猫窝领养">
        <div class="cattery-head">
          <h2>猫窝</h2>
          <button id="cattery-back" type="button">回牌桌</button>
        </div>
        <div id="cat-grid"></div>
        <div class="cattery-note">技能按自然日重置，失败不扣猫条。</div>
      </aside>
    </main>
    <section id="collection" aria-label="手机猫条与收藏栏">
      <div class="collection-heading">
        <span>猫条条</span>
        <small id="collection-treats">🐟 0</small>
        <button id="mobile-cattery-toggle" type="button">进猫窝</button>
      </div>
      <div id="mobile-cat-slots" class="collection-slots"></div>
    </section>
  </div>
