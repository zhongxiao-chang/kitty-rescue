<body>
  <div class="shell">
    <div class="topbar">
      <div>
        <h1 id="game-title">Kitty Rescue</h1>
        <p class="brand-subtitle">Stack the tiles, free the cats.</p>
        <div class="subline">
          <span id="level-name"></span>
          <span id="stats"></span>
        </div>
      </div>
      <div class="controls">
        <span id="treats-hud" class="treats-hud">Treats 🐟0</span>
        <div id="unlock-widget" class="unlock-widget" aria-label="Level progress">
          <svg class="unlock-ring" viewBox="0 0 72 72" aria-hidden="true">
            <circle class="unlock-ring-bg" cx="36" cy="36" r="30"></circle>
            <circle id="unlock-ring-progress" class="unlock-ring-progress" cx="36" cy="36" r="30"></circle>
          </svg>
          <div id="unlock-cage" class="unlock-cage">
            <div id="unlock-cat" class="unlock-cat"></div>
            <span id="unlock-fish" class="unlock-fish" aria-hidden="true">
              <svg viewBox="0 0 28 18">
                <path d="M4 9c5-7 14-7 21 0-7 7-16 7-21 0Z" fill="#78CBEA" stroke="#2F6F8F" stroke-width="1.8"></path>
                <path d="M4 9 0 3v12Z" fill="#78CBEA" stroke="#2F6F8F" stroke-width="1.8" stroke-linejoin="round"></path>
                <circle cx="20" cy="7" r="1.5" fill="#384B57"></circle>
              </svg>
            </span>
          </div>
          <div id="unlock-links" class="unlock-links"></div>
          <span id="unlock-count" class="unlock-count">0/8</span>
        </div>
        <button id="mute" type="button" aria-pressed="false">Sound: On</button>
        <button id="restart" type="button">Restart</button>
        <button id="next" type="button">Next Level</button>
      </div>
    </div>
    <div id="tutorial" hidden>
      <span id="tutorial-step">1/7</span>
      <span id="tutorial-text"></span>
      <button id="tutorial-next" type="button" hidden>Next</button>
      <button id="tutorial-skip" type="button">Skip Tutorial</button>
    </div>
    <main id="game-layout">
      <section id="play-area">
        <div id="canvas-wrap">
          <canvas id="game" width="960" height="540" aria-label="Kitty Rescue tile matching game"></canvas>
          <div id="tutorial-slot-focus" hidden aria-hidden="true"></div>
        </div>
        <div class="controls play-controls">
          <button id="copy" type="button">Copy (2)</button>
          <button id="color" type="button">Color Swap (2)</button>
          <button id="bomb" type="button">Hairball (2)</button>
          <button id="shuffle" type="button">Shuffle (3)</button>
          <button id="undo" type="button">Step Back (1)</button>
          <button id="move-out" type="button">Move Out (2)</button>
        </div>
        <div id="message" role="status" aria-live="polite"></div>
      </section>
      <aside id="cattery" aria-label="Cattery and cat skills">
        <div class="cattery-head">
          <h2>Cattery</h2>
          <button id="cattery-back" type="button">Back to Board</button>
        </div>
        <div id="cat-grid"></div>
        <div class="cattery-note">Skills reset daily. Failed runs cost no treats.</div>
      </aside>
    </main>
    <section id="collection" aria-label="Treats and cat collection">
      <div class="collection-heading">
        <span>Wallet</span>
        <small id="collection-treats">🐟0</small>
        <button id="mobile-cattery-toggle" type="button">Cattery</button>
      </div>
      <div id="mobile-cat-slots" class="collection-slots"></div>
    </section>
  </div>
